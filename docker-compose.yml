
services:
  postgres-primary:
    image: postgres:17
    container_name: chat-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatdb"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  postgres-replica:
    image: postgres:17
    container_name: chat-postgres-replica
    restart: unless-stopped
    environment:
      PGHOST: postgres-primary
      PGPORT: "5432"
      PGUSER: replicator
      PGPASSWORD: ${REPLICATION_PASSWORD:?Define REPLICATION_PASSWORD no .env}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./replica-init.sh:/usr/local/bin/replica-init.sh:ro
    entrypoint: ["bash", "/usr/local/bin/replica-init.sh"]
    depends_on:
      postgres-primary:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-a:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      PGHOST: postgres-primary
      PGPORT: "5432"
      PGDATABASE: chatdb
      PGUSER: chatuser
      REDIS_URL: redis://redis:6379
      INSTANCE_ID: backend-a
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      

  backend-b:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      PGHOST: postgres-primary
      PGPORT: "5432"
      PGDATABASE: chatdb
      PGUSER: chatuser
      REDIS_URL: redis://redis:6379
      INSTANCE_ID: backend-b
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
     

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-a
      - backend-b

volumes:
  postgres_primary_data:
  postgres_replica_data:
  redis_data:
